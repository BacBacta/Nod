[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib", "node_modules"]
cache_path = "contracts/cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
# DevLocal.s.sol writes local (anvil) addresses for the frontend.
fs_permissions = [{ access = "write", path = "./frontend/src/deployments" }]
