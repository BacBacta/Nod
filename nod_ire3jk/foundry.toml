[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib", "node_modules"]
cache_path = "contracts/cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
# DevLocal.s.sol writes local (anvil) addresses for the frontend.
fs_permissions = [{ access = "write", path = "./frontend/src/deployments" }]

# Fork tests against Arc mainnet (Bullcheese/Uniswap contracts use post-Paris opcodes):
#   ARC_MAINNET_RPC=https://rpc.mainnet.arc.io FOUNDRY_PROFILE=fork forge test --match-path "contracts/test/fork/*"
[profile.fork]
evm_version = "cancun"
